version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: fleettrack-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fleettrack
    volumes:
      - mongo-data:/data/db

  # MariaDB Relational Database Service (Fuel Analytics)
  mariadb:
    image: mariadb:10.11
    container_name: fleettrack-mariadb
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fleettrack_analytics
      MYSQL_USER: fleetuser
      MYSQL_PASSWORD: fleetpassword
    volumes:
      - mariadb-data:/var/lib/mysql

  # Backend Express REST API Service
  backend:
    build: ./backend
    container_name: fleettrack-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/fleettrack
      MYSQL_HOST: mariadb
      MYSQL_USER: fleetuser
      MYSQL_PASSWORD: fleetpassword
      MYSQL_DATABASE: fleettrack_analytics
      JWT_SECRET: supersecretfleettrackjwtkey2026
    depends_on:
      - mongodb
      - mariadb

  # Frontend React/Vite SPA Service
  frontend:
    build: ./frontend
    container_name: fleettrack-ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  mariadb-data: